services:
  mysql:
    image: mysql:8.4
    container_name: geant_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: geant_recruitment
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: geant_mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: geant_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: mysql://root:root@mysql:3306/geant_recruitment?charset=utf8mb4
      JWT_ACCESS_SECRET: change_me_access_secret
      JWT_REFRESH_SECRET: change_me_refresh_secret
      RESET_TOKEN_SECRET: change_me_reset_secret
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      RESET_TOKEN_TTL: 30m
      UPLOAD_DIR: /uploads
      SEED_ON_DEPLOY: 'true'
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_FROM: recruitment@geant.dz
    ports:
      - '4000:4000'
    volumes:
      - uploads_data:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: geant_frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://backend:4000/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/fr']
      interval: 20s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  uploads_data:
